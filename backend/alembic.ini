# Alembic: the database's shape, as numbered migrations in migrations/versions.
# The database URL is not set here: migrations/env.py takes it from
# TRUSTPUNCH_DB (see app/core/config.py), like the server does.
#
#   .venv/bin/alembic upgrade head                 # bring the database up to date
#   .venv/bin/alembic current                      # where it is now
#   .venv/bin/alembic revision -m "0003 users"     # a new migration (then edit it)
#
# The server and app.cli run `upgrade head` themselves at start-up.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
