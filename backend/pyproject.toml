[project]
name = "trustpunch-api"
version = "0.3.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Run from backend/: `app` is imported from here.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
# E/F/W: errors · I: import order · B: likely bugs · UP: modern syntax
# S: security (Bandit rules) · BLE: blind except · ASYNC · PIE · RET
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "ASYNC", "PIE", "RET"]
ignore = [
  "E501",   # long lines: the formatter handles what it can
  "RET505", # else after return reads better in the CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and test tokens are fine in tests
"migrations/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
