<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustPunch – Attendance Prototype</title>
<style>
:root{
  --page:#E8EBF5; --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#EFF2FF; --text:#0E1330; --muted:#6B7391; --line:#E4E8F5;
  --primary:#2E3FE0; --primary-ink:#FFFFFF; --primary-soft:#E8EBFF;
  --green:#16A34A; --green-soft:#E1F6E8; --red:#D92D3A; --red-soft:#FDE7E9; --amber:#A8660B; --amber-soft:#FFF0D2; --grey-soft:#EEF0F6;
  --shadow:0 1px 2px rgba(14,19,48,.05),0 8px 24px rgba(14,19,48,.07);
  --frame:#0E1330;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#070918; --bg:#0C1022; --surface:#151A36; --surface-2:#1C2248; --text:#EEF0FF; --muted:#9BA3CC; --line:#272E5A;
    --primary:#6B7BFF; --primary-ink:#0A0D24; --primary-soft:#232B6B;
    --green:#3DD17A; --green-soft:#12301F; --red:#FF6B76; --red-soft:#3A1519; --amber:#F2B04A; --amber-soft:#3A2A0B; --grey-soft:#20264A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --frame:#000;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.grow{flex:1}
.ic{flex:none;display:block}

/* ---------- stage / device ---------- */
.stage{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding:24px}
.panel{width:290px;align-self:center;max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.panel h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--text)}
.jump button:hover{background:var(--primary-soft)}
.device{width:390px;height:844px;max-height:calc(100vh - 48px);position:relative;overflow:hidden;background:var(--bg);border-radius:44px;box-shadow:0 0 0 9px var(--frame),0 30px 80px rgba(10,14,40,.28)}
@media (max-width:760px){
  .stage{padding:0;display:block}.panel{display:none}
  .device{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.slide{animation:slide .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.scroll{flex:1;overflow:auto;padding:4px 18px 28px}
.scroll.pad-tab{padding-bottom:24px}
.top{display:flex;align-items:center;gap:6px;padding:14px 12px 10px;min-height:60px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.tint{background:var(--surface-2);border-radius:0 0 28px 28px;padding-bottom:18px}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{background:var(--grey-soft)}
.tint-wrap{background:var(--surface-2);border-radius:0 0 28px 28px;padding-bottom:18px}
.tint-wrap .top{padding-bottom:6px}

/* tab bar */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:14px}
.tabbar button.on{color:var(--primary)}
.tabbar button.on .ic{stroke-width:2.2}

/* generic */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.btn{height:50px;border-radius:16px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.outline{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.sm{height:44px;font-size:15px;padding:0 24px;border-radius:14px}
.btn[disabled]{background:var(--grey-soft);color:var(--muted);box-shadow:none;cursor:not-allowed;opacity:.9}
.btn.ghost[disabled]{background:transparent}.btn.outline[disabled]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.chip.green{background:var(--green-soft);color:var(--green)}.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.grey{background:var(--grey-soft);color:var(--muted)}
.muted{color:var(--muted)}
.section-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:22px 2px 12px}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block}
.av.ph{background:var(--primary-soft);color:var(--primary);display:inline-grid;place-items:center}
.av.init{background:var(--primary-soft);color:var(--primary);display:inline-grid;place-items:center;font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);padding:70px 20px;text-align:center;font-weight:700;font-size:17px}
.empty .ic{opacity:.6}

/* home */
.home-hd{display:flex;align-items:center;gap:12px;padding:18px 18px 8px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#2E3FE0,#7A5BFF);display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.02em}
.home-hd .hi{font-size:20px;font-weight:800;letter-spacing:-.02em}
.home-hd .org{color:var(--muted);font-size:13.5px}
.bell{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.bell i{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.banner{display:flex;align-items:center;gap:10px;background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;margin:8px 0 14px}
.att{padding:18px}
.att-row{display:flex;align-items:center;gap:12px}
.att-date{font-weight:700;font-size:16px}
.att hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.times{display:flex;justify-content:space-between}
.times b{display:block;font-size:20px;letter-spacing:-.02em}
.times span{color:var(--muted);font-size:13px}
.times div:last-child{text-align:right}
.att-act{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.shiftcode{font-size:12.5px;color:var(--muted);text-align:right;margin-top:3px}
.qa{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px 16px;width:100%;text-align:left;box-shadow:var(--shadow);margin-bottom:10px}
.qa .tile{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.qa b{font-weight:700}.qa .grow{font-weight:700}
.qa .ic.chev{color:var(--muted)}
.qa .badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}

/* camera */
.camwrap{position:relative;flex:1;background:#111;overflow:hidden}
.camwrap video,.camwrap .frozen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camwrap video{transform:scaleX(-1)}
.camfb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfd3ee;text-align:center;padding:30px;background:linear-gradient(180deg,#2a3052,#12152b)}
.camfb svg{width:62%;border-radius:24px}
.camfb p{font-size:13.5px;max-width:260px}
.camfb[hidden],.autochip[hidden],.frozen[hidden]{display:none}
.autochip{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(14,19,48,.7);color:#fff;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px}
.shoot{position:absolute;left:0;right:0;bottom:0;height:84px;border-radius:30px 30px 0 0;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:18px}
.facefoot{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 28px;display:flex;gap:14px;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.facefoot .btn{min-width:64px}
.ring-btn{width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.4);margin:0 auto}

/* overlay */
#overlay{position:absolute;inset:0;z-index:50;pointer-events:none}
#overlay>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(10,12,30,.52);animation:fade .2s}
.scrim.clear{background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:30px 30px 0 0;padding:22px 20px 26px;animation:up .26s cubic-bezier(.2,.8,.2,1);max-height:92%;display:flex;flex-direction:column}
.sheet.tall{height:90%}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 14px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sheet .meta{color:var(--muted);margin-top:4px;font-size:15px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.sheet-foot{display:flex;gap:12px;margin-top:18px}
.sheet-foot .btn{flex:1}
.dialog{position:absolute;left:22px;right:22px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:28px;padding:26px 22px 22px;animation:fade .2s;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h3{font-size:19px;font-weight:800}
.dialog .x{position:absolute;top:14px;right:14px}
.dialog .center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:14px 4px 4px}
.dialog .foot{display:flex;justify-content:flex-end;margin-top:22px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:rot .8s linear infinite;flex:none}
.spin.sm{width:20px;height:20px;border-width:3px}
@keyframes rot{to{transform:rotate(360deg)}}
.pop{position:absolute;top:62px;left:14px;min-width:190px;background:var(--surface);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:6px;animation:fade .15s}
.pop button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;font-weight:500}
.pop button:hover,.pop button.on{background:var(--grey-soft)}
.pop.right{left:auto;right:18px;top:auto}
.bigcheck{width:68px;height:68px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.bigcheck.red{background:var(--red)}
.okbtn{position:relative;width:100%;height:52px;border-radius:16px;background:var(--primary-soft);color:var(--primary);font-weight:800;margin-top:22px;overflow:hidden}
.okbtn i{position:absolute;left:0;bottom:0;height:3px;background:var(--primary);transition:width 1s linear}
.prog{height:9px;border-radius:6px;background:var(--primary-soft);overflow:hidden;margin:16px 0 8px}
.prog i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .4s}
.stat{display:flex;justify-content:space-between;font-weight:800;margin-top:26px}
.stat .s{color:var(--green)}.stat .f{color:var(--red)}
#toast{position:absolute;left:16px;right:16px;top:70px;z-index:90;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.toast{padding:15px 16px;border-radius:12px;color:#fff;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .22s}
.toast.ok{background:#259C45}.toast.info{background:#6F7385}.toast.err{background:#C9303C}

/* fields */
.field{margin-bottom:16px}
.field label.l{display:block;font-weight:700;margin:0 0 8px}
.input,.select{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;display:flex;align-items:center;gap:10px;font-size:15.5px;text-align:left}
.input:focus,.select:focus,textarea:focus{outline:none;border-color:var(--primary)}
.input.ro{background:var(--grey-soft);color:var(--muted);pointer-events:none}
.select .ph{color:var(--muted)}
textarea.input{height:100px;padding:12px 14px;resize:none;display:block}
.search{position:relative}
.search .ic{position:absolute;left:14px;top:15px;color:var(--muted)}
.search input{padding-left:44px}
.sw{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw.on{background:var(--primary)}.sw.on::after{transform:translateX(20px)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--primary)}.radio.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--primary)}
.setrow{display:flex;align-items:center;gap:14px;padding:16px 0}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .tile{width:42px;height:42px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.setrow b{display:block;font-weight:700}.setrow small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin:0 18px 16px}
.tabs button{flex:1;padding:12px 0;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1.5px;height:3.5px;border-radius:3px;background:var(--primary)}
.togrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:12px;font-weight:700}
.sub-checks{padding:6px 4px 2px}
.sub-checks .row{display:flex;align-items:center;gap:14px;padding:10px 4px}
.sub-checks.off{opacity:.45;pointer-events:none}

/* profile */
.prof-card{padding:18px}
.prof-top{display:flex;gap:16px;align-items:center}
.prof-top .nm{font-size:22px;font-weight:800;letter-spacing:-.02em}
.prof-top .id{color:var(--muted)}
.prof-top .role{color:var(--primary);font-weight:700}
.kvrow{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.kvrow .ic{color:var(--muted)}
.kvrow small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.kvrow span{display:block;font-weight:500}
.time-box{flex:1;background:var(--surface-2);border-radius:16px;padding:12px 14px;position:relative;border:1.5px solid var(--line)}
.time-box small{color:var(--muted);display:block}
.time-box b{font-size:22px;color:var(--primary);letter-spacing:-.02em}
.time-box input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.avbig{position:relative;width:112px;height:112px;margin:8px auto 18px}
.avbig .av{width:112px;height:112px;font-size:34px}
.avbig .cambadge{position:absolute;right:-2px;bottom:2px;width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;border:3px solid var(--bg)}

/* more */
.acc{background:var(--surface);border-radius:20px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.acc>button{display:flex;align-items:center;width:100%;padding:20px 18px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.acc>button .ic{color:var(--primary)}
.acc .body{border-top:1px solid var(--line);padding:4px 0 6px}
.acc .item{display:flex;align-items:center;gap:14px;padding:14px 18px;width:100%;text-align:left}
.acc .item .tile{width:40px;height:40px;border-radius:50%;background:var(--grey-soft);color:var(--muted);display:grid;place-items:center}
.acc .item .grow{font-weight:500}
.acc .item:hover{background:var(--surface-2)}
.ver{text-align:center;color:var(--muted);font-weight:600;font-size:13px;margin:22px 0 8px}
.link{color:var(--primary);font-weight:700}

/* history / filters */
.filters{display:flex;justify-content:space-between;gap:12px;padding:0 18px}
.fbtn{height:46px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:500;max-width:60%}
.fbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn .ic{color:var(--primary)}
.balrow{display:flex;gap:12px;padding:0 18px;overflow:hidden}
.balcard{background:var(--surface);border-radius:20px;padding:16px;flex:1;min-width:0;box-shadow:var(--shadow)}
.balcard h3{font-size:19px;font-weight:800;margin-bottom:12px}
.balcard .n{display:flex;gap:30px}
.balcard .n b{font-size:20px;color:var(--muted);display:block}
.balcard .n small{color:var(--muted)}
.balcard.all{display:grid;place-items:center;color:var(--primary);font-weight:800;gap:0}
.lcard{position:relative;display:flex;gap:16px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.lcard .kv{margin-bottom:5px;color:var(--muted)}.lcard .kv b{color:var(--text)}
.lcard .tag{position:absolute;top:14px;right:0;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:10px 0 0 10px}
.tag.Pending{background:#FFC23D;color:#3a2a00}.tag.Approved{background:var(--green);color:#fff}.tag.Rejected{background:var(--red);color:#fff}.tag.Cancelled{background:var(--grey-soft);color:var(--muted)}
.kebab{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:40px;display:grid;place-items:center;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border-radius:14px;background:var(--surface-2);margin-bottom:8px;font-weight:500;text-align:left}
.opt.on{background:var(--primary);color:var(--primary-ink);font-weight:700}
.opt.exp{flex-direction:column;align-items:stretch;gap:12px}
.opt.exp>div{display:flex;justify-content:space-between;align-items:center}
.opt .dates{display:flex;gap:10px}
.opt .dates input{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;color:var(--text)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px}
.cal-head b{font-size:19px;font-weight:800}
.cal-nav{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--primary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal-grid .dow{font-weight:600;color:var(--muted);font-size:13.5px;padding:8px 0}
.cd{height:46px;display:grid;place-items:center;font-weight:500;position:relative}
.cd button{width:100%;height:100%;display:grid;place-items:center;position:relative;z-index:1}
.cd.dis{color:var(--muted);opacity:.5}
.cd.dis button{pointer-events:none}
.cd.mid{background:var(--primary-soft)}
.cd.sel{background:var(--primary-soft)}
.cd.sel.a{border-radius:23px 0 0 23px}.cd.sel.b{border-radius:0 23px 23px 0}.cd.sel.a.b{border-radius:23px}
.cd.sel button{color:var(--primary-ink);}
.cd.sel button::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:var(--primary);z-index:-1}
.cd.today button{color:var(--primary);font-weight:800}
.cd.hol::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.cd.lv::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--green)}

function tabbar(a){
  const t=[['home','Home','home'],['dashboard','Dashboard','dash'],['profile','Profile','user'],['more','More','menu']];
  return `<nav class="tabbar">${t.map(([k,l,i])=>`<button class="${a===k?'on':''}" data-a="tab" data-v="${k}">${ic(i,24)}${l}</button>`).join('')}</nav>`;
}
function dayStatus(){return S.day.inAt&&!S.day.outAt?'in':S.day.outAt?'out':'none'}
function workedHrs(){if(!S.day.inAt)return 0;const a=new Date(S.day.inAt),b=S.day.outAt?new Date(S.day.outAt):new Date();return Math.max(0,(b-a)/36e5)}
const used=()=>S.leaves.filter(l=>l.status==='Pending'||l.status==='Approved').reduce((a,l)=>a+l.days,0);
const balance=()=>LEAVE_TOTAL-used();
function addNotif(t){S.notifs.unshift({id:uid(),t,at:new Date().toISOString()});S.notifs=S.notifs.slice(0,30)}

A.clockIn=()=>startPunch('in');A.clockOut=()=>startPunch('out');
function startPunch(kind){
  openOv({type:'loc',acc:32});

  ovTimer=setInterval(()=>{acc=Math.max(7,acc-Math.round(5+Math.random()*6));if(O&&O.type==='loc'){O.acc=acc;const e=$('#acc');if(e)e.textContent=acc}},330);
  const t=setTimeout(()=>{if(O&&O.type==='loc'){closeOv();go('camera',{kind})}},1700);timers.push(t);
}

async function startCamera(vid,fb,allowAuto){
  const v=document.getElementById(vid),f=document.getElementById(fb);if(!v)return;
  if(S.set.native){v.style.display='none';f.hidden=false;$('#camfbmsg').textContent="Using your phone's camera app (Settings ▸ Use Native Camera).";return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    v.srcObject=stream;await v.play();camOK=true;
  }catch(e){camOK=false;v.style.display='none';f.hidden=false}
  if(allowAuto&&S.set.auto&&curName()==='camera'){
    const chipEl=$('#autochip');let n=3;chipEl.hidden=false;chipEl.textContent=`Auto capture in ${n}`;
    const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);chipEl.hidden=true;if(curName()==='camera'&&!O)A.shoot()}else chipEl.textContent=`Auto capture in ${n}`},1000);timers.push(iv);
  }
}
function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function drawSample(x,w,h){
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#cfd6ea');g.addColorStop(1,'#9aa5c9');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#4a7a4f';x.beginPath();x.ellipse(w/2,h*1.02,w*.55,h*.3,0,0,Math.PI*2);x.fill();
  x.fillStyle='#d9a47c';x.fillRect(w*.43,h*.55,w*.14,h*.12);
  x.beginPath();x.ellipse(w/2,h*.42,w*.2,h*.22,0,0,Math.PI*2);x.fill();
  x.fillStyle='#231d1b';x.beginPath();x.ellipse(w/2,h*.31,w*.21,h*.13,0,Math.PI,Math.PI*2);x.fill();
  x.fillRect(w*.3,h*.31,w*.06,h*.12);
}
function sampleFace(){return `<svg viewBox="0 0 200 240"><rect width="200" height="240" fill="#aab4d4"/><path d="M10 250c0-50 40-72 90-72s90 22 90 72z" fill="#4a7a4f"/><rect x="86" y="140" width="28" height="34" rx="10" fill="#d9a47c"/><ellipse cx="100" cy="100" rx="40" ry="48" fill="#d9a47c"/><path d="M58 96c-4-42 24-58 44-58s46 14 40 58c-6-18-18-26-42-26s-34 8-42 26z" fill="#231d1b"/><circle cx="86" cy="102" r="3.5" fill="#231d1b"/><circle cx="114" cy="102" r="3.5" fill="#231d1b"/><path d="M88 124q12 7 24 0" stroke="#7a3b2e" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`}
function snap(){
  const c=document.createElement('canvas');c.width=360;c.height=480;const x=c.getContext('2d');
  const v=$('#cam')||$('#fcam');
  if(camOK&&v&&v.videoWidth){
    const vw=v.videoWidth,vh=v.videoHeight,tr=360/480;let sw=vw,sh=vw/tr;if(sh>vh){sh=vh;sw=vh*tr}
    x.translate(360,0);x.scale(-1,1);x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,360,480);
  }else drawSample(x,360,480);
  return c.toDataURL('image/jpeg',.78);
}
function fileToPhoto(file){
  return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=360;c.height=480;const x=c.getContext('2d');
    const tr=.75;let sw=im.width,sh=im.width/tr;if(sh>im.height){sh=im.height;sw=im.height*tr}
    x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,360,480);res(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)});
}
A.shoot=()=>{if(S.set.native){N.nativeFor='punch';$('#nativeFile').click()}else afterShot(snap())};
$('#nativeFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const url=await fileToPhoto(f);
  if(N.nativeFor==='face')faceShot(url);else afterShot(url);
});
function afterShot(photo){
  if(curName()!=='camera')return;
  const kind=cur().p.kind;
  const fr=$('#frozen');fr.src=photo;fr.hidden=false;$('#shootbtn').hidden=true;$('#autochip').hidden=true;
  openOv({type:'punch',kind,photo,at:new Date(),job:null,sub:null,phase:kind==='in'?'job':'ok',q:''});
  if(kind==='out')finishPunch();
}

function jobsForPick(q){
  q=(q||'').toLowerCase();
  const ordered=[...RECENT_JOBS.map(c=>JOBS.find(j=>j.code===c)),...JOBS.filter(j=>!RECENT_JOBS.includes(j.code))];

}

A.contJob=()=>finishPunch();
IN.jobq=v=>{O.q=v;const l=$('#joblist');if(l)l.innerHTML=jobsForPick(v)};
function finishPunch(){
  const o=O,now=o.at;
  const rec={id:uid(),type:o.kind,at:now.toISOString(),job:o.job,synced:S.online,offline:!S.online};
  S.log.push(rec);
  if(o.kind==='in')S.day={...S.day,date:iso(now),inAt:now.toISOString(),outAt:null,job:o.job,photo:o.photo};
  else{S.day.outAt=now.toISOString();S.day.photo=S.day.photo||o.photo}
  addNotif(`Clocked ${o.kind==='in'?'in':'out'} at ${t12(now)}${S.online?'':' (offline)'}`);
  save();
  o.phase=S.online?'ok':'offline';o.cd=3;o.sub=null;renderOv();
  if(o.phase==='ok'){
    ovTimer=setInterval(()=>{
      if(!O||O.type!=='punch'){clearInterval(ovTimer);return}
      O.cd--;const t=$('#oktxt'),b=$('#okbar');
      if(O.cd<=0){clearInterval(ovTimer);A.okDone();return}
      if(t)t.textContent=`OK (${O.cd}s)`;if(b)b.style.width=(O.cd/3*100)+'%';
    },1000);
    setTimeout(()=>{const b=$('#okbar');if(b)b.style.width='66%'},60);
  }
}
A.okDone=()=>{closeOv();N.stack=[];render(false)};
A.syncLater=()=>{closeOv();N.stack=[];render(false)};
A.syncNow=()=>runSync(true);
function runSync(fromPunch){
  const list=S.log.filter(l=>!l.synced);
  if(!S.online){toast('No internet connection. Connect and try again.','err');return}
  if(!list.length){toast('Everything is already synced','info');return}
  openOv({type:'sync',total:list.length,done:0,fromPunch});
  let i=0;
  ovTimer=setInterval(()=>{
    i++;list[i-1].synced=true;
    if(i>=list.length){clearInterval(ovTimer);save();addNotif(`${list.length} offline punch${list.length>1?'es':''} synced`);O={type:'syncdone',total:list.length,ok:list.length,fail:0,fromPunch};renderOv();render()}
    else{O.done=i;renderOv()}
  },700);
}

let TSD=null;
function tsRec(d){return S.ts[d]||(S.ts[d]={entries:[],submitted:false})}
const tsDone=e=>e.job&&e.act&&+e.hrs>0;
SCREENS.timesheet=()=>{
  const d=TSD||(TSD=today0());const rec=tsRec(d);
  const isToday=d===today0();const wk=isToday?workedHrs():0;
  const sum=rec.entries.reduce((a,e)=>a+(+e.hrs||0),0);

      <span class="l">Hours</span><div class="stepper"><input type="number" step="0.5" min="0" max="24" value="${e.hrs}" ${dis} data-in="tsHrs" data-id="${e.id}"><button ${dis} data-a="tsDec" data-v="${e.id}" aria-label="Less">${ic('minus',20)}</button><button ${dis} data-a="tsInc" data-v="${e.id}" aria-label="More">${ic('plus',20)}</button></div></div>`}).join('');
  return `<div class="screen">${topbar('Activity Timesheet')}
    <div class="tsbar"><button class="icon-btn" data-a="tsPrev" aria-label="Previous day">${ic('chevL',20)}</button>
      <label class="datebtn">${fd(d).replace(/^(\d+) (\w+) (\d+)$/,'$1 $2, $3')} ${ic('cal',20)}<input type="date" data-ch="tsDate" data-picker value="${d}"></label>

      <div class="worked"><div><small>Worked Hrs</small><b>${wk.toFixed(2)}</b></div>${st==='in'?chip('In','green'):st==='out'?chip('Out','grey'):chip('Not In','red')}</div>
      <div class="section-title" style="color:var(--primary);font-size:17px">Activities Logged (${rec.entries.length})${rec.submitted?' · Submitted':''}</div>
      ${rec.entries.length?entries:empty('No activities added for this day','clip')}
      ${rec.submitted?'':`<button class="addbtn" data-a="tsAdd">${ic('plus',18)} Add</button>`}
    </div>
    <div class="tsfoot"><div class="unmapped"><span>Unmapped Hours</span><span id="unmapped">${Math.max(0,wk-sum).toFixed(2)} hrs</span></div>
      <div class="two"><button class="btn outline" id="tsDraft" data-a="tsDraft" ${rec.entries.length&&!rec.submitted?'':'disabled'}>Save Draft</button>
      <button class="btn" id="tsSubmit" data-a="tsSubmit" ${rec.entries.length&&rec.entries.every(tsDone)&&!rec.submitted?'':'disabled'}>Submit Activity</button></div></div></div>`;

function tsShift(n){const d=parse(TSD||today0());d.setDate(d.getDate()+n);TSD=iso(d);render()}
A.tsPrev=()=>tsShift(-1);A.tsNext=()=>tsShift(1);
CH.tsDate=v=>{if(v){TSD=v;render()}};
A.tsAdd=()=>{tsRec(TSD).entries.push({id:uid(),job:null,act:null,hrs:0});save();render()};
A.tsRemove=v=>{const r=tsRec(TSD);r.entries=r.entries.filter(e=>e.id!==v);save();render()};
const tsEntry=id=>tsRec(TSD).entries.find(e=>e.id===id);

IN.tsHrs=(v,el)=>{const e=tsEntry(el.dataset.id);e.hrs=v===''?0:Math.max(0,Math.min(24,+v));refreshTsFoot()};

function leaveDays(from,to,fdur,tdur){
  const n=Math.round((parse(to)-parse(from))/864e5)+1;const half=x=>x&&x!=='Full Day'&&x!=='Duration';
  if(n===1)return half(fdur)?.5:1;return n-(half(fdur)?.5:0)-(half(tdur)?.5:0);
}
const FILT={};
const fget=k=>FILT[k]||(FILT[k]={status:'All',touched:false,range:'All Time',date:'',from:'',to:''});
function inRange(f,d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const day=864e5;const ws=new Date(t);ws.setDate(t.getDate()-((t.getDay()+6)%7));const we=new Date(ws);we.setDate(ws.getDate()+6);
  switch(f.range){
    case 'Today':return +x===+t;case 'Yesterday':return +x===+t-day;
    case 'This Week':return x>=ws&&x<=we;
    case 'This Month':return x.getMonth()===t.getMonth()&&x.getFullYear()===t.getFullYear();
    case 'This Year':return x.getFullYear()===t.getFullYear();
    case 'Date':return !f.date||iso(x)===f.date;
    case 'Date Range':return (!f.from||x>=parse(f.from))&&(!f.to||x<=parse(f.to));
    default:return true;
  }
}
const rangeLabel=f=>f.range==='Date'&&f.date?fd(f.date):f.range==='Date Range'&&(f.from||f.to)?`${f.from?fd(f.from).slice(0,6):'…'} – ${f.to?fd(f.to).slice(0,6):'…'}`:f.range;

SCREENS.leaveCal=()=>{
  const m=LC.month,y=m.getFullYear(),mo=m.getMonth();const first=new Date(y,mo,1);const lead=(first.getDay()+6)%7;
  const dim=new Date(y,mo+1,0).getDate();const tdy=today0();
  const cells=[];
  for(let i=0;i<lead;i++){const d=new Date(y,mo,1-lead+i);cells.push({d,other:true})}
  for(let i=1;i<=dim;i++)cells.push({d:new Date(y,mo,i)});
  while(cells.length%7)cells.push({d:new Date(y,mo,dim+cells.length-lead-dim+1),other:true});
  const durSel=(k,v)=>`<select data-ch="${k}"><option value="" ${!v?'selected':''} disabled>Duration</option>${['Full Day','First Half','Second Half'].map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  const hol=new Set(HOLIDAYS.map(h=>h[0])),lv=new Set();
  S.leaves.filter(l=>l.status==='Pending'||l.status==='Approved').forEach(l=>{for(let d=parse(l.from);d<=parse(l.to);d.setDate(d.getDate()+1))lv.add(iso(d))});
  return `<div class="screen"><header class="top"><button class="icon-btn" data-a="back">${ic('chevL',24)}</button><h1>Time Off Request</h1><div class="grow"></div><button class="link" style="padding:8px 10px" data-a="lcClear">Clear</button></header>
  <div class="scroll"><div class="rangebox"><div><small>First Day of time off</small><b>${LC.from?fd(LC.from):'-'}</b></div>${durSel('lcFd',LC.fd)}</div>
  <div class="rangebox"><div><small>Last Day of time off</small><b>${LC.to?fd(LC.to):'-'}</b></div>${durSel('lcTd',LC.td)}</div>
  <div class="cal-head"><button class="cal-nav" data-a="lcMonth" data-v="-1">${ic('chevL',22)}</button><b>${MON[mo]} ${y}</b><button class="cal-nav" data-a="lcMonth" data-v="1">${ic('chevR',22)}</button></div>
  <div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
  ${cells.map(c=>{const k=iso(c.d);const past=k<tdy;const dis=c.other||past||UNAVAILABLE.has(k);
    const isA=LC.from&&k===LC.from,isB=LC.to&&k===LC.to;const mid=LC.from&&LC.to&&k>LC.from&&k<LC.to;
    const cls=['cd',dis?'dis':'',mid?'mid':'',(isA||isB)?'sel':'',isA?'a':'',(isB||(isA&&!LC.to))?'b':'',k===tdy?'today':'',hol.has(k)&&!c.other?'hol':'',lv.has(k)&&!c.other?'lv':''].join(' ');
    return `<div class="${cls}"><button data-a="lcDay" data-v="${k}">${c.d.getDate()}</button></div>`}).join('')}</div>
  <div class="muted" style="display:flex;gap:16px;font-size:12.5px;margin-top:14px"><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber)"></i> Holiday</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)"></i> Your leave</span></div>
  </div><div class="footer-cta"><button class="btn block" data-a="lcDone">Done</button></div></div>`;
};

A.applyLeave=()=>{
  const days=leaveDays(LF.from,LF.to||LF.from,LF.fd,LF.td);
  const f=LF.from,t=LF.to||LF.from;
  if(S.leaves.some(l=>(l.status==='Pending'||l.status==='Approved')&&!(t<l.from||f>l.to))){toast('You already have time off on these dates','err');return}
  if(days>balance()+1e-9){toast(`Insufficient balance (${balance().toFixed(2)} left)`,'err');return}
  S.leaves.unshift({id:uid(),type:LF.type,from:f,to:t,fd:LF.fd,td:LF.td,days,reason:LF.reason.trim(),comment:'',status:'Pending',file:LF.file});
  addNotif(`Time off requested for ${fd(f)}`);save();resetLeaveForm();
  N.stack=[{name:'leaveHistory',p:{}}];render(false);toast('Leave applied successfully!','ok');
};

SCREENS.leaveCalendar=()=>{
  const m=N.calMonth||(N.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1));
  const y=m.getFullYear(),mo=m.getMonth();const lead=(new Date(y,mo,1).getDay()+6)%7;const dim=new Date(y,mo+1,0).getDate();const tdy=today0();
  const hol=new Map(HOLIDAYS.map(h=>[h[0],h[1]])),lv=new Map();
  S.leaves.filter(l=>l.status!=='Cancelled'&&l.status!=='Rejected').forEach(l=>{for(let d=parse(l.from);d<=parse(l.to);d.setDate(d.getDate()+1))lv.set(iso(d),l)});
  const cells=[];for(let i=0;i<lead;i++)cells.push(null);for(let i=1;i<=dim;i++)cells.push(new Date(y,mo,i));
  const ev=[];for(let i=1;i<=dim;i++){const k=iso(new Date(y,mo,i));if(hol.has(k))ev.push(['hol',k,hol.get(k)]);if(lv.has(k))ev.push(['lv',k,`DG Leave · ${lv.get(k).status}`])}
  return `<div class="screen">${topbar('Time Off Calendar')}<div class="scroll">
  <div class="cal-head" style="margin-top:6px"><button class="cal-nav" data-a="calMonth" data-v="-1">${ic('chevL',22)}</button><b>${MONL[mo]} ${y}</b><button class="cal-nav" data-a="calMonth" data-v="1">${ic('chevR',22)}</button></div>
  <div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
  ${cells.map(d=>{if(!d)return '<div></div>';const k=iso(d);return `<div class="cd ${k===tdy?'today':''} ${hol.has(k)?'hol':''} ${lv.has(k)?'lv':''}"><button style="${k===tdy?'color:var(--primary);font-weight:800':''}">${d.getDate()}</button></div>`}).join('')}</div>
  <div class="section-title">This month</div>
  ${ev.length?ev.map(e=>`<div class="syncitem"><span class="tile" style="background:var(--${e[0]==='hol'?'amber':'green'}-soft);color:var(--${e[0]==='hol'?'amber':'green'})">${ic(e[0]==='hol'?'cal':'umbrella',22)}</span><div><b>${fd(e[1])}</b><div class="muted">${esc(e[2])}</div></div></div>`).join(''):`<p class="muted">No holidays or time off this month.</p>`}
  </div></div>`;
};

SCREENS.pending=()=>{
  const un=S.log.filter(l=>!l.synced),pl=S.leaves.filter(l=>l.status==='Pending');

  return `<div class="screen">${topbar('Pending Actions')}<div class="scroll">${rows.length?rows.join(''):empty('No pending actions','check')}</div></div>`;
};
SCREENS.notifications=()=>`<div class="screen">${topbar('Notifications')}<div class="scroll">${S.notifs.length?S.notifs.map(n=>{const d=new Date(n.at);return `<div class="syncitem"><span class="tile" style="background:var(--primary-soft);color:var(--primary)">${ic('bell',22)}</span><div><b>${esc(n.t)}</b><div class="muted" style="font-size:13.5px">${dLong(d)} · ${t12(d)}</div></div></div>`}).join(''):empty('No notifications','bell')}</div></div>`;

/* ======================= OFFLINE SYNC DASHBOARD ======================= */
SCREENS.sync=p=>{
  const t=N.syncTab||'pending';
  const pend=S.log.filter(l=>!l.synced),done=S.log.filter(l=>l.synced&&l.offline);
  const list=t==='pending'?pend:done;
  return `<div class="screen"><div class="tint-wrap">${topbar('Offline Sync Dashboard')}
    <div class="tabs" style="margin:6px 18px 0;border-color:var(--line)"><button class="${t==='pending'?'on':''}" data-a="syncTab" data-v="pending">Pending${pend.length?' ('+pend.length+')':''}</button><button class="${t==='completed'?'on':''}" data-a="syncTab" data-v="completed">Completed</button></div></div>
    <div class="scroll" style="padding-top:18px">${list.length?list.slice().reverse().map(syncRow).join(''):empty('No punches','docSearch')}</div>
    ${t==='pending'&&pend.length?`<div class="footer-cta"><button class="btn block" data-a="syncAll">${ic('sync',20)} Sync All</button></div>`:''}</div>`;
};
A.syncTab=v=>{N.syncTab=v;render()};A.syncAll=()=>runSync(false);

/* ======================= PROFILE ======================= */
SCREENS.profile=()=>{
  const u=S.user;
  const kv=(i,l,v)=>`<div class="kvrow">${ic(i,22)}<div><small>${l}</small><span>${v||'—'}</span></div></div>`;
  return `<div class="screen"><div class="scroll pad-tab" style="padding-top:18px">
    <div class="card prof-card"><div class="prof-top">${avatarInit(78)}<div class="grow"><div class="nm">${esc(u.name)}</div><div class="id">ID ${u.id}</div><div class="role">${esc(u.role)}</div></div><button class="icon-btn" data-a="go" data-v="editProfile" aria-label="Edit">${ic('pencil',22)}</button></div>
      <div style="margin-top:14px">${kv('mail','Email',esc(u.email))}${kv('phone','Mobile',esc(u.mobile))}${kv('pin','Base Site',esc(u.site))}${kv('building','Department',esc(u.dept))}${kv('user','Manager',esc(u.manager))}</div></div>
    <div class="card" style="margin-top:16px;padding:6px 16px">
      <button class="setrow" style="width:100%;text-align:left" data-a="go" data-v="notifPrefs"><span class="tile">${ic('bell',22)}</span><b class="grow">Notification Preferences</b>${ic('chevR',20)}</button>
      <div class="setrow"><span class="tile">${ic('volume',22)}</span><div class="grow"><b>Notification Sound</b><small>Play a sound for new alerts</small></div>${sw('set.sound',S.set.sound)}</div>
      <div class="setrow"><span class="tile">${ic('clock',22)}</span><div class="grow"><b>Clock In's Reminder</b><small>Remind me to mark clock in's</small></div>${sw('set.reminder',S.set.reminder)}</div>
      ${S.set.reminder?`<div style="padding:0 0 18px 8px"><div class="muted" style="font-weight:700;margin:0 0 10px">At Scheduled Time</div><div style="display:flex;gap:12px">
        <label class="time-box"><small>In Reminder</small><b>${tfmt(S.set.inRem)}</b><input type="time" data-in="inRem" value="${S.set.inRem}"></label>
        <label class="time-box"><small>Out Reminder</small><b>${tfmt(S.set.outRem)}</b><input type="time" data-in="outRem" value="${S.set.outRem}"></label></div></div>`:''}
    </div>
    <div class="card" style="margin-top:16px;padding:6px 16px"><div class="setrow"><span class="tile">${ic('globe',22)}</span><b class="grow">App Language</b>
      <select class="select" style="width:150px;height:44px" data-ch="lang">${['English','العربية','हिन्दी','മലയാളം','اردو'].map(l=>`<option ${S.set.lang===l?'selected':''}>${l}</option>`).join('')}</select></div></div>
  </div>${tabbar('profile')}</div>`;
};
const tfmt=v=>{const [h,m]=v.split(':').map(Number);const d=new Date();d.setHours(h,m);return t12(d)};
IN.inRem=v=>{if(v){S.set.inRem=v;save();render()}};IN.outRem=v=>{if(v){S.set.outRem=v;save();render()}};
CH.lang=v=>{S.set.lang=v;save();if(v!=='English')toast('Prototype copy is English-only','info');renderPanel()};

SCREENS.editProfile=()=>{
  const u=S.user;N.edit=N.edit||{name:u.name,mobile:u.mobile};
  const dirty=N.edit.name.trim()!==u.name||N.edit.mobile!==u.mobile;
  const ro=(l,v)=>`<div class="field" data-a="locked"><label class="l">${l}</label><div class="input ro">${esc(v)||'&nbsp;'}</div></div>`;
  return `<div class="screen">${topbar('Edit Profile')}<div class="scroll">
    <div class="avbig">${avatarInit(112)}<button class="cambadge" data-a="changePhoto" aria-label="Change photo">${ic('cam',18)}</button></div>
    <div class="field"><label class="l">Name</label><input class="input" data-in="eName" value="${esc(N.edit.name)}"></div>
    ${ro('Email',u.email)}
    <div class="field"><label class="l">Mobile</label><input class="input" data-in="eMobile" inputmode="tel" value="${esc(N.edit.mobile)}"></div>
    ${ro('Role',u.role)}${ro('Department',u.dept)}${ro('Manager',u.manager)}
  </div><div class="footer-cta"><button class="btn block" id="saveProf" data-a="saveProfile" ${dirty?'':'disabled'}>Save</button></div></div>`;
};
HOOKS.editProfile=()=>{N.edit=null};
function editDirty(){const b=$('#saveProf');if(b)b.disabled=!(N.edit.name.trim()&&(N.edit.name.trim()!==S.user.name||N.edit.mobile!==S.user.mobile))}
IN.eName=v=>{N.edit.name=v;editDirty()};IN.eMobile=v=>{N.edit.mobile=v;editDirty()};
A.locked=()=>toast("This field can only be modified by your organization's manager/admin.",'info');
A.saveProfile=()=>{S.user.name=N.edit.name.trim();S.user.mobile=N.edit.mobile.trim();N.edit=null;save();toast('Profile updated','ok');back()};
A.changePhoto=()=>$('#photoFile').click();
$('#photoFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;S.photo=await fileToPhoto(f);save();render();toast('Profile photo updated','ok')});

/* ======================= NOTIFICATION PREFERENCES ======================= */
SCREENS.notifPrefs=()=>{
  const t=N.npTab||'app';const np=S.np;
  const tr=(label,path,on)=>`<div class="togrow"><span>${label}</span>${sw(path,on)}</div>`;
  let body='';
  if(t==='app')body=tr('Missed Clock Out','np.app.missedOut',np.app.missedOut)+tr('Regularization Approval','np.app.regApproval',np.app.regApproval)+tr('Late Clock In for Assigned Shift','np.app.late',np.app.late)+tr('Clock In Without a Planned Shift','np.app.noShift',np.app.noShift)+tr('Clock In on a Different Shift than Assigned','np.app.diffShift',np.app.diffShift);
  if(t==='email'){
    const e=np.email,rows=[['inTime','In Time Restriction Alert'],['outLoc','Out of location'],['regReq','Regularization Request'],['missedOut','Missed Clock Out'],['autoDeact','Employee Auto Deactivated'],['breakAlert','Break time Alert']];
    body=`<div class="card" style="margin-bottom:12px;padding:6px 18px 12px"><div class="togrow" style="box-shadow:none;padding:16px 0 8px;margin:0;background:none"><span>Alerts Summary</span>${sw('np.email.summary',e.summary)}</div>
      <div class="sub-checks ${e.summary?'':'off'}">${rows.map(([k,l])=>`<div class="row">${chk('np.email.'+k,e[k])}<span>${l}</span></div>`).join('')}</div></div>`
      +tr('Leave Cancelled','np.email.leaveCancel',e.leaveCancel)+tr('Leave Rejected','np.email.leaveReject',e.leaveReject)+tr('Leave Approved','np.email.leaveApprove',e.leaveApprove);
  }
  if(t==='sms')body=tr('Missed Clock Out','np.sms.missedOut',np.sms.missedOut)+tr('Leave Approved','np.sms.leaveApprove',np.sms.leaveApprove)+tr('Leave Rejected','np.sms.leaveReject',np.sms.leaveReject)+tr('Leave Cancelled','np.sms.leaveCancel',np.sms.leaveCancel);
  return `<div class="screen"><div class="tint-wrap">${topbar('Notification Preferences')}<div class="tabs" style="margin-top:8px;margin-bottom:0">${[['app','User App'],['email','Email'],['sms','SMS']].map(([k,l])=>`<button class="${t===k?'on':''}" data-a="npTab" data-v="${k}">${l}</button>`).join('')}</div></div>
    <div class="scroll" style="padding-top:18px">${body}</div></div>`;
};
A.npTab=v=>{N.npTab=v;render()};

/* ======================= SETTINGS ======================= */
SCREENS.settings=()=>`<div class="screen"><div class="tint-wrap">${topbar('Settings')}<div style="padding:8px 22px 0;font-weight:800;letter-spacing:.06em;color:var(--muted);font-size:13px">CLOCK IN'S &amp; CAMERA</div></div>
  <div class="scroll" style="padding-top:16px"><div class="card" style="padding:4px 16px">
   <div class="setrow"><span class="tile">${ic('shutter',22)}</span><div class="grow"><b>Auto Click Clock In's</b><small>Capture your face automatically when marking clock in's, no manual tap needed.</small></div>${sw('set.auto',S.set.auto)}</div>
   <div class="setrow"><span class="tile">${ic('cam',22)}</span><div class="grow"><b>Use Native Camera</b><small>Open your phone's camera app instead of the in-app camera.</small></div>${sw('set.native',S.set.native)}</div>
  </div></div></div>`;

/* ======================= MORE ======================= */
const MORE=[
  ['Time Tracking',[['My Overtime History','overtime','history'],['My Shift & Weekly Off History','shiftHistory','swap']]],
  ['Activity Timesheet',[['My Activity Timesheet','timesheet','clip']]],
  ['Time Off Management',[['Apply Time Off','leaveForm','umbrella'],['Time Off History','leaveHistory','history'],['Time Off Balance','leaveBalance','umbrella'],['Time Off Calendar','leaveCalendar','cal'],['Holiday Calendar','holidays','cal']]],
  ['Geofencing',[['My Sites','sites','target']]],
  ['Other Settings',[['Settings','settings','gear'],['Offline Sync Dashboard','sync','sync'],['Register Your Face','faceReg','face']]]
];
SCREENS.more=()=>{
  const anyOpen=Object.values(N.open).some(Boolean);
  return `<div class="screen"><div class="scroll pad-tab" style="padding-top:22px">
   <div style="display:flex;align-items:center;margin-bottom:18px"><h1 style="font-size:24px;letter-spacing:-.02em" class="grow">More Actions</h1><button class="link" style="display:flex;align-items:center;gap:6px" data-a="toggleAll">${anyOpen?'Collapse All':'Expand All'}${ic(anyOpen?'chevU':'chevD',20)}</button></div>
   ${MORE.map(([t,items])=>{const o=!!N.open[t];return `<div class="acc"><button data-a="acc" data-v="${t}"><span class="grow" style="text-align:left">${t}</span>${ic(o?'chevU':'chevD',22)}</button>${o?`<div class="body">${items.map(([l,s,i])=>`<button class="item" data-a="go" data-v="${s}"><span class="tile">${ic(i,20)}</span><span class="grow">${l}</span>${ic('chevR',20)}</button>`).join('')}</div>`:''}</div>`}).join('')}
   <div class="ver"><b style="color:var(--text);font-size:15px">TrustPunch</b><br>Prototype v1.0</div>
   <div class="card"><h2 style="font-size:16px;margin-bottom:6px">Prototype controls</h2>${controls()}</div>
  </div>${tabbar('more')}</div>`;
};
A.acc=v=>{N.open[v]=!N.open[v];render()};
A.toggleAll=()=>{const any=Object.values(N.open).some(Boolean);MORE.forEach(([t])=>N.open[t]=!any);render()};
SCREENS.sites=()=>`<div class="screen">${topbar('My Sites')}<div class="scroll">
  <div class="site-map"><svg viewBox="0 0 340 170"><defs><pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="currentColor" stroke-opacity=".08"/></pattern></defs><rect width="340" height="170" fill="url(#g)"/><circle cx="170" cy="85" r="64" fill="var(--primary)" fill-opacity=".12" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6 5"/><circle cx="170" cy="85" r="8" fill="var(--primary)"/></svg></div>
  <div class="card"><div class="setrow"><span class="tile">${ic('pin',22)}</span><div class="grow"><b>${esc(S.user.site)}</b><small>Base site · geofence radius 100 m</small></div>${chip('Inside','green')}</div></div></div></div>`;

/* ======================= FACE REGISTRATION ======================= */
function faceSvg(o={}){
  const skin='#E7B48D',hair='#2A2220';
  return `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="${o.dark?'#202024':'#EEF0F4'}"/><path d="M26 200c0-42 32-60 74-60s74 18 74 60z" fill="#1F2F5C"/><path d="M84 142l16 14 16-14" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/><rect x="87" y="118" width="26" height="28" rx="9" fill="${skin}"/><ellipse cx="100" cy="82" rx="36" ry="43" fill="${skin}"/><path d="M62 80c-3-36 20-50 40-50s41 13 38 48c-6-14-14-21-38-21s-33 6-40 23z" fill="${hair}"/><circle cx="88" cy="86" r="3" fill="#222"/><circle cx="112" cy="86" r="3" fill="#222"/><path d="M88 103q12 9 24 0" stroke="#7a3b2e" fill="none" stroke-width="3" stroke-linecap="round"/>
  ${o.mask?'<path d="M64 94h72v14q-36 28-72 0z" fill="#6FB6E8"/>':''}${o.hat?'<path d="M60 64q40-44 80 0z" fill="#1f2a44"/><rect x="54" y="62" width="92" height="9" rx="4" fill="#1f2a44"/>':''}${o.glasses?'<rect x="70" y="76" width="26" height="17" rx="7" fill="#111"/><rect x="104" y="76" width="26" height="17" rx="7" fill="#111"/><path d="M96 83h8" stroke="#111" stroke-width="3"/>':''}${o.dark?'<rect width="200" height="200" fill="#000" opacity=".55"/>':''}</svg>`;
}
SCREENS.faceReg=()=>`<div class="screen">${topbar('Register your face')}<div class="scroll">
  <div class="hdr-ok"><span class="dot">${ic('check',20)}</span>Take a photo like this</div>
  <div class="face-ex">${faceSvg()}<i></i><i></i><i></i><i></i></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
  <div class="hdr-no"><span class="dot">${ic('x',20)}</span>Avoid taking photo like this</div>
  <div class="avoid">${[['mask','Avoid mask',{mask:1}],['hat','Avoid hat',{hat:1}],['glasses','Avoid glasses',{glasses:1}],['dark','Avoid dark photo',{dark:1}]].map(([k,l,o])=>`<figure><div class="t">${faceSvg(o)}<b>${ic('x',11)}</b></div>${l}</figure>`).join('')}</div>
  </div><div class="footer-cta"><button class="btn block" data-a="faceStart">${ic('cam',20)} Take Photo</button></div></div>`;
A.faceStart=()=>go('faceCam');
SCREENS.faceCam=()=>`<div class="screen" style="background:#000"><div class="camwrap" id="fcwrap">
  <video id="fcam" autoplay playsinline muted></video>
  <div class="camfb" id="fcfb" hidden>${sampleFace()}<p id="camfbmsg">Camera not available in this browser – a sample selfie will be used.</p></div>
  <img class="frozen" id="fcfrozen" hidden alt="">
  <button class="icon-btn" style="position:absolute;top:14px;left:12px;color:#fff;background:rgba(0,0,0,.35)" data-a="back">${ic('chevL',24)}</button>
  <div class="facefoot" id="fcfoot"><button class="ring-btn" data-a="faceShoot" aria-label="Capture"></button></div></div></div>`;
HOOKS.faceCam=()=>{startCamera('fcam','fcfb',false)};
A.faceShoot=()=>{if(S.set.native){N.nativeFor='face';$('#nativeFile').click()}else faceShot(snap())};
function faceShot(url){
  const fr=$('#fcfrozen');if(!fr)return;fr.src=url;fr.hidden=false;
  $('#fcfoot').innerHTML=`<button class="btn" style="background:#142072;color:#aab4ff;width:84px" data-a="faceRetake" aria-label="Retake">${ic('refresh',24)}</button><button class="btn" style="background:#142072;color:#fff;flex:1;max-width:210px" data-a="faceDone">Done</button>`;
}
A.faceRetake=()=>{$('#fcfrozen').hidden=true;$('#fcfoot').innerHTML=`<button class="ring-btn" data-a="faceShoot" aria-label="Capture"></button>`};
A.faceDone=()=>{
  if(S.faceRegistered)openOv({type:'failFace'});
  else{S.faceRegistered=true;save();toast('Face registered successfully','ok');back()}
};
OV.failFace=()=>`<div class="scrim"></div><div class="dialog"><button class="icon-btn x" data-a="scrim">${ic('x',24)}</button><div class="center" style="padding-top:34px">${ic('info',46)}<b style="font-size:19px">Fail! Staff photo already exists!</b><button class="btn" style="width:86px;margin-top:20px" data-a="faceRetry" aria-label="Retry">${ic('refresh',24)}</button></div></div>`;
A.faceRetry=()=>{closeOv();A.faceRetake()};

/* ======================= PANEL / CONTROLS ======================= */
function controls(){
  return `<div class="setrow" style="padding:12px 0"><div class="grow"><b>Network</b><small>${S.online?'Online':'Offline – punches are queued'}</small></div>${sw('online',S.online)}</div>
  <div class="setrow" style="padding:12px 0"><div class="grow"><b>Face already registered</b><small>Shows the “photo already exists” result</small></div>${sw('faceRegistered',S.faceRegistered)}</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button class="btn outline sm" style="height:38px;font-size:13.5px;padding:0 14px" data-a="mgr" data-v="Approved">Manager approves leave</button>
  <button class="btn outline sm" style="height:38px;font-size:13.5px;padding:0 14px" data-a="mgr" data-v="Rejected">Manager rejects leave</button>
  <button class="btn outline sm" style="height:38px;font-size:13.5px;padding:0 14px;color:var(--red)" data-a="reset">Reset all data</button></div>`;
}
const JUMPS=[['Home','home'],['Clock in','clockin'],['Clock out','clockout'],['Dashboard','dashboard'],['Profile','profile'],['Edit profile','editProfile'],['Notification prefs','notifPrefs'],['More','more'],['Timesheet','timesheet'],['Apply time off','leaveForm'],['Time off history','leaveHistory'],['Time off balance','leaveBalance'],['Time off calendar','leaveCalendar'],['Holidays','holidays'],['Shift & weekly off','shiftHistory'],['Overtime','overtime'],['Sync dashboard','sync'],['Settings','settings'],['Register face','faceReg'],['My sites','sites'],['Pending actions','pending'],['Notifications','notifications']];
function renderPanel(){
  const p=$('#panel');if(!p)return;
  p.innerHTML=`<h2>TrustPunch</h2><div class="sub">Attendance app prototype · all flows are clickable. Data stays in this browser.</div>
  <h4>Prototype controls</h4>${controls()}<h4>Jump to screen</h4><div class="jump">${JUMPS.map(([l,k])=>`<button data-a="jump" data-v="${k}">${l}</button>`).join('')}</div>`;
}
A.jump=v=>jump(v);
A.mgr=v=>{
  const l=S.leaves.find(x=>x.status==='Pending');if(!l){toast('No pending leave request to decide on','info');return}
  l.status=v;l.comment=v==='Approved'?'Approved. Enjoy your time off.':'Not possible during this period.';
  addNotif(`Your time off for ${fd(l.from)} was ${v.toLowerCase()}`);save();toast(`Leave ${v.toLowerCase()} by manager`,v==='Approved'?'ok':'err');render();
};
A.reset=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=defaults();N={tab:'home',stack:[],open:{}};TSD=null;resetLeaveForm();closeOv();render();toast('Prototype data reset','info')};

/* ======================= generic actions ======================= */
A.back=()=>back();A.tab=v=>tab(v);
A.go=v=>{if(v==='leaveForm')resetLeaveForm();if(v==='leaveCalendar')N.calMonth=null;go(v)};
A.scrim=()=>closeOv();
A.tog=v=>{
  if(v==='online'){S.online=!S.online;toast(S.online?'Back online':'You are offline','info');}
  else setP(S,v,!getP(S,v));
  save();render();
};

/* ---------- global listeners ---------- */
document.addEventListener('click',e=>{
  const pk=e.target.closest('input[type=date][data-picker]');if(pk&&pk.showPicker){try{pk.showPicker()}catch(_){}}
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(fn)fn(el.dataset.v,el,e);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target.value,e.target)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ch;if(k&&CH[k])CH[k](e.target.value,e.target)});

/* ---------- boot ---------- */
const h=location.hash.replace('#','');
if(h&&(SCREENS[h]||h==='clockin'||h==='clockout'))jump(h);else render();
</script>
</body>
